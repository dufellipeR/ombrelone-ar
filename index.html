<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="MVP de WebAR: visualize o Ombrelone Lateral Octo 3,0m em 3D e projete no seu ambiente pelo celular.">
  <title>Ombrelone Lateral Octo 3,0m · Solemar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a'/%3E%3Cpath d='M6 16a10 10 0 0 1 20 0z' fill='%23fff'/%3E%3Cpath d='M16 16v8.5' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">

  <!-- Componente oficial de WebAR do Google (versão fixada) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>

  <style>
    :root {
      --ink: #0f172a;
      --ink-soft: #475569;
      --line: #e2e8f0;
      --bg: #eef1f5;
      --card: #ffffff;
      --accent: #0f172a;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px 16px calc(32px + env(safe-area-inset-bottom));
      background:
        radial-gradient(1100px 520px at 50% -10%, #ffffff 0%, var(--bg) 60%) fixed;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 18px 40px -24px rgba(15, 23, 42, .45), 0 2px 6px rgba(15, 23, 42, .04);
    }

    .brand {
      margin: 0 0 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 5vw, 24px);
      line-height: 1.2;
      letter-spacing: -.01em;
    }

    .sub {
      margin: 6px 0 0;
      font-size: 14px;
      color: var(--ink-soft);
    }

    .price {
      margin: 14px 0 0;
      font-size: 15px;
      color: var(--ink-soft);
    }

    .price strong {
      font-size: 22px;
      color: var(--ink);
      letter-spacing: -.01em;
    }

    /* ---------- Visualizador 3D ---------- */

    .viewer-wrap {
      position: relative;
      margin-top: 16px;
      border-radius: var(--radius);
      overflow: hidden;
      background: linear-gradient(180deg, #f7f9fb 0%, #e7ecf2 100%);
      border: 1px solid var(--line);
    }

    model-viewer {
      display: block;
      width: 100%;
      height: clamp(320px, 58vh, 460px);
      background-color: transparent;
      --progress-bar-color: var(--accent);
      --progress-bar-height: 3px;
      --poster-color: transparent;
      touch-action: pan-y;
    }

    .poster {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 13px;
      color: var(--ink-soft);
      background: linear-gradient(180deg, #f7f9fb 0%, #e7ecf2 100%);
    }

    .spinner {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(15, 23, 42, .15);
      border-top-color: var(--ink);
      animation: girar .8s linear infinite;
    }

    @keyframes girar { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 3s; }
    }

    .ar-btn {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      font: inherit;
      font-size: 15px;
      font-weight: 650;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 10px 24px -8px rgba(15, 23, 42, .7);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .ar-btn:active { transform: translateX(-50%) scale(.97); }

    .ar-btn:focus-visible {
      outline: 2px solid #fff;
      outline-offset: -4px;
      box-shadow: 0 0 0 3px var(--ink), 0 10px 24px -8px rgba(15, 23, 42, .7);
    }

    .hint {
      margin: 10px 0 0;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--ink-soft);
      display: flex;
      gap: 6px;
      align-items: flex-start;
    }

    .hint[hidden] { display: none; }

    /* ---------- Variações ---------- */

    .variacoes {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin: 0 0 12px;
      font-size: 13px;
      color: var(--ink-soft);
    }

    .label strong {
      color: var(--ink);
      font-weight: 650;
    }

    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .sw {
      --sw: #ccc;
      position: relative;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(15, 23, 42, .16);
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), transparent 58%),
        var(--sw);
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .sw:hover { transform: translateY(-1px); }

    .sw[aria-pressed="true"] {
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink);
    }

    .sw:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    .sw[aria-pressed="true"]::after {
      content: "✓";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .55);
    }

    .foot {
      margin-top: 18px;
      font-size: 11.5px;
      line-height: 1.5;
      color: #7c8798;
    }

    .foot a { color: inherit; }

    @media (min-width: 720px) {
      body { padding-top: 40px; }
    }
  </style>
</head>
<body>

  <main class="card">
    <p class="brand">Solemar · MVP WebAR</p>
    <h1>Ombrelone Lateral Octo 3,0m</h1>
    <p class="sub">Tecido Tidelli · Estrutura em alumínio</p>
    <p class="price">A partir de <strong>R$ 4.890</strong></p>

    <div class="viewer-wrap">
      <!--
        Sem `ios-src` de propósito: no model-viewer 4.x isso faz o USDZ ser
        gerado no próprio navegador no toque do botão, preservando a cor
        escolhida no AR do iPhone. Não troque as texturas para WebP/KTX2:
        o exportador de USDZ não converte textura comprimida e o Quick Look
        não lê WebP (o modelo iria para o AR sem textura).
      -->
      <model-viewer
        id="viewer"
        src="ombrelone.glb"
        alt="Ombrelone lateral de 3 metros com tecido claro e estrutura metálica"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-placement="floor"
        ar-scale="auto"
        ar-usdz-max-texture-size="2048"
        camera-controls
        auto-rotate
        auto-rotate-delay="2500"
        rotation-per-second="18deg"
        camera-orbit="18deg 72deg 88%"
        min-camera-orbit="auto 0deg auto"
        max-camera-orbit="auto 92deg auto"
        shadow-intensity="1"
        shadow-softness="0.85"
        environment-image="neutral"
        exposure="1.05"
        interaction-prompt="none"
        xr-environment
        touch-action="pan-y"
        reveal="auto">

        <!-- Aparece apenas quando o navegador suporta AR -->
        <button slot="ar-button" class="ar-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
            <path d="M12 3 3 7.5v9L12 21l9-4.5v-9L12 3z" />
            <path d="M3 7.5 12 12l9-4.5M12 12v9" />
          </svg>
          Ver no meu espaço
        </button>

        <!-- Placeholder enquanto o .glb baixa -->
        <div slot="poster" class="poster">
          <div class="spinner" aria-hidden="true"></div>
          <span>Carregando modelo 3D…</span>
        </div>
      </model-viewer>
    </div>

    <p class="hint" id="hint" hidden>
      <span aria-hidden="true">ℹ️</span>
      <span id="hint-text"></span>
    </p>

    <section class="variacoes" aria-labelledby="cor-label">
      <p class="label" id="cor-label">
        <span>Cor do tecido</span>
        <strong id="cor-nome" aria-live="polite">Natural</strong>
      </p>
      <div class="swatches" role="group" aria-labelledby="cor-label">
        <button class="sw" style="--sw:#d9d9d9" data-cor="natural" aria-pressed="true"  aria-label="Tecido natural"></button>
        <button class="sw" style="--sw:#7d8d70" data-cor="agave"    aria-pressed="false" aria-label="Tecido agave"></button>
        <button class="sw" style="--sw:#d8c5a1" data-cor="areia"    aria-pressed="false" aria-label="Tecido areia"></button>
        <button class="sw" style="--sw:#3f464d" data-cor="grafite"  aria-pressed="false" aria-label="Tecido grafite"></button>
        <button class="sw" style="--sw:#b4654a" data-cor="terracota" aria-pressed="false" aria-label="Tecido terracota"></button>
      </div>
    </section>

    <p class="foot">
      Modelo 3D: <a href="https://sketchfab.com/3d-models/ombrelone-lateral-octo-tecido-tidelli-agave-casa-b6eead8fbb594e9eb9d90b52a5ed4bb7" target="_blank" rel="noopener noreferrer">Grupo Oca</a>
      · Licença CC BY 4.0. Recolorização e projeção em AR: protótipo Solemar.
    </p>
  </main>

  <script>
    const viewer = document.getElementById('viewer');
    const hint = document.getElementById('hint');
    const hintText = document.getElementById('hint-text');
    const corNome = document.getElementById('cor-nome');

    /* Materiais do glTF que formam o tecido do ombrelone. */
    const MATERIAIS_TECIDO = ['TECIDO', 'TECIDO01', 'TECIDO02', 'FrontCol'];

    /*
      Presets de cor. Os valores em `ganho` compensam o fato de a textura
      original ser cinza-clara: sem esse ajuste as cores sairiam lavadas/escuras.
      `hex` é a cor percebida; o modelo recebe o fator em espaço linear.
    */
    const CORES = {
      natural:   { rotulo: 'Natural',   hex: '#ffffff', ganho: 1.00 },
      agave:     { rotulo: 'Agave',     hex: '#7d8d70', ganho: 1.55 },
      areia:     { rotulo: 'Areia',     hex: '#d8c5a1', ganho: 1.55 },
      grafite:   { rotulo: 'Grafite',   hex: '#3f464d', ganho: 1.30 },
      terracota: { rotulo: 'Terracota', hex: '#b4654a', ganho: 1.45 }
    };

    const srgbParaLinear = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));

    function hexParaLinear(hex) {
      const n = parseInt(hex.replace('#', ''), 16);
      return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255]
        .map(srgbParaLinear);
    }

    function aplicarCor(chave) {
      const preset = CORES[chave];
      if (!preset) return;

      corNome.textContent = preset.rotulo;

      const modelo = viewer.model;
      if (!modelo) return; // ainda carregando: aplicamos no evento 'load'

      const linear = hexParaLinear(preset.hex).map((v) => Math.min(1, v * preset.ganho));

      for (const nome of MATERIAIS_TECIDO) {
        const material = modelo.getMaterialByName(nome);
        const pbr = material && material.pbrMetallicRoughness;
        if (pbr && typeof pbr.setBaseColorFactor === 'function') {
          pbr.setBaseColorFactor([linear[0], linear[1], linear[2], 1]);
        }
      }
    }

    let corAtual = 'natural';

    document.querySelectorAll('.sw').forEach((botao) => {
      botao.addEventListener('click', () => {
        corAtual = botao.dataset.cor;
        document.querySelectorAll('.sw').forEach((b) => {
          b.setAttribute('aria-pressed', String(b === botao));
        });
        aplicarCor(corAtual);
      });
    });

    /* Reaplica a cor escolhida depois que o modelo termina de carregar. */
    viewer.addEventListener('load', () => aplicarCor(corAtual));

    /* Aviso quando o dispositivo/navegador não consegue abrir AR. */
    const ehIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    function atualizarAvisoAR() {
      const suporta = viewer.canActivateAR !== false;
      hint.hidden = suporta;
      if (suporta) return;

      hintText.innerHTML = 'AR indisponível neste navegador. Abra pelo <strong>Chrome do Android</strong> ' +
        'ou pelo <strong>Safari do iPhone</strong>, sempre em uma URL <strong>HTTPS</strong>.';
    }
    viewer.addEventListener('load', atualizarAvisoAR);
    atualizarAvisoAR();

    /* Diagnóstico rápido no console (útil durante o pitch). */
    viewer.addEventListener('load', () => {
      console.log('[AR] materiais:', viewer.model.materials.map((m) => m.name));
      console.log('[AR] canActivateAR:', viewer.canActivateAR);
      const d = viewer.getDimensions();
      console.log('[AR] dimensões (m):', d.x.toFixed(2), d.y.toFixed(2), d.z.toFixed(2));
    });

    viewer.addEventListener('ar-status', (evento) => {
      const status = evento.detail.status;
      console.log('[AR] status:', status);

      if (status === 'failed') {
        hint.hidden = false;
        hintText.innerHTML = ehIOS
          ? 'Não foi possível abrir o AR. Atualize o <strong>iOS</strong> e tente novamente pelo <strong>Safari</strong>.'
          : 'Não foi possível iniciar o AR. Verifique se o <strong>Google Play Services para RA</strong> ' +
            'está instalado e atualizado no aparelho.';
      }
      if (status === 'session-started') {
        hint.hidden = true;
      }
    });
  </script>
</body>
</html>
